<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filmine</title>
<style>
  /* 品牌红线(CLAUDE.md 设计原则 3):Portra 黄只标 active / selected /
     developing。落地页没有任何 active 状态,因此全走 paper 层级,层次由
     weight + opacity 建立,行动感由描边承担。 */
  :root{--ink:#0A0A0A;--paper:#FAFAFA;--rule:rgba(250,250,250,.34)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--paper);
       font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
       -webkit-font-smoothing:antialiased;
       min-height:100vh;display:flex;align-items:center;justify-content:center}
  .wrap{max-width:680px;padding:64px 24px;text-align:center}
  h1{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
  .brand{font-style:italic;color:rgba(250,250,250,.55);font-size:15px;margin:0 0 8px}
  .line{color:rgba(250,250,250,.62);font-size:15px;margin:0}
  .line.en{color:rgba(250,250,250,.45);margin:0 0 40px}
  nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  nav a{display:inline-block;padding:13px 22px;border-radius:8px;
        color:var(--paper);text-decoration:none;font-weight:600;font-size:14px;
        border:1px solid var(--rule);
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .mail{margin-top:40px;font-size:13px;color:rgba(250,250,250,.32)}
  .mail a{color:rgba(250,250,250,.55)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Filmine</h1>
  <p class="brand">let it develop</p>
  <p class="line">实况照片的数字暗房。所有处理都在你的设备上完成。</p>
  <p class="line en">A digital darkroom for Live Photos. Everything happens on your device.</p>
  <nav>
    <a href="privacy.html">隐私政策 · Privacy</a>
    <a href="support.html">支持 · Support</a>
  </nav>
  <p class="mail"><a href="mailto:hello@filmine.app">hello@filmine.app</a></p>
</div>
</body>
</html>
